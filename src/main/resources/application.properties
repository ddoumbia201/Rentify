spring.application.name=location-biens

# URL de connexion à la base de données que tu as nommée location_biens
spring.datasource.url=jdbc:mysql://localhost:3306/location_biens

# Identifiants par défaut de XAMPP
spring.datasource.username=root
spring.datasource.password=

# Demande à Spring Boot de créer/mettre à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Optionnel : Afficher les requêtes SQL dans la console pour vérifier que tout fonctionne
spring.jpa.show-sql=true