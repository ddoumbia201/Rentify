<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — EventShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">EventShare</a>
        <div class="nav-actions">
            <a href="login.html" class="btn">Connexion</a>
            <a href="register.html" class="btn btn-primary">Inscription</a>
        </div>
    </nav>

    <form class="form-page">
        <h2>Créer un compte</h2>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.com">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="8 caractères minimum">

        <label for="password-confirm">Confirmer le mot de passe</label>
        <input type="password" id="password-confirm" placeholder="••••••••">

        <button type="submit" class="btn btn-primary">S'inscrire</button>

        <p class="form-footer">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </p>
    </form>

</body>
</html>
