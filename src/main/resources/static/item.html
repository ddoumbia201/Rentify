<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Château gonflable "Château fort" — EventShare</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/escape.js"></script>
    <script src="/js/csrf.js"></script>
    <script src="/js/navbar.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">EventShare</a>
        <div class="nav-actions">
            <a href="login.html" class="btn">Connexion</a>
            <a href="register.html" class="btn btn-primary">Inscription</a>
        </div>
    </nav>

    <main class="item-detail">

        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1464349153735-7db50ed83c84?w=900" alt="Annonce">
 
            <h1 class="item-title-large">Chargement...</h1>
            <span class="item-category"></span>
            <p class="item-owner"></p>
 
            <p class="item-description"></p>
        </div>

        <aside class="booking-box">
            <div class="price"></div>
 
            <form>
                <label for="booking-start">Date de début</label>
                <input type="date" id="booking-start">
 
                <label for="booking-end">Date de fin</label>
                <input type="date" id="booking-end">
 
                <button type="submit" class="btn btn-primary">Réserver</button>
            </form>
        </aside>

    </main>

    <script src="/js/item.js"></script>
</body>
</html>
