<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes annonces — EventShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">EventShare</a>
        <div class="nav-actions">
            <a href="my_items.html" class="btn">Mes annonces</a>
            <a href="my_bookings.html" class="btn">Mes réservations</a>
        </div>
    </nav>

    <div class="dashboard">
        <div class="dashboard-header">
            <h1>Mes annonces</h1>
            <a href="item-form.html" class="btn btn-primary">+ Ajouter une annonce</a>
        </div>

        <main class="catalogue">
            <article class="item-card">
                <img src="https://images.unsplash.com/photo-1464349153735-7db50ed83c84?w=400" alt="Château gonflable">
                <div class="item-body">
                    <div class="item-title">Château gonflable "Château fort"</div>
                    <span class="item-category">Animation</span>
                    <div class="item-price">45 € / jour</div>
                </div>
                <div class="item-card-actions">
                    <a href="item-form.html" class="btn">Modifier</a>
                    <button class="btn">Supprimer</button>
                </div>
            </article>

            <article class="item-card">
                <img src="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?w=400" alt="Chaises pliantes">
                <div class="item-body">
                    <div class="item-title">Set de 50 chaises pliantes</div>
                    <span class="item-category">Mobilier</span>
                    <div class="item-price">20 € / jour</div>
                </div>
                <div class="item-card-actions">
                    <a href="item-form.html" class="btn">Modifier</a>
                    <button class="btn">Supprimer</button>
                </div>
            </article>

            <article class="item-card">
                <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=400" alt="Arche florale">
                <div class="item-body">
                    <div class="item-title">Arche florale décorative</div>
                    <span class="item-category">Décoration</span>
                    <div class="item-price">35 € / jour</div>
                </div>
                <div class="item-card-actions">
                    <a href="item-form.html" class="btn">Modifier</a>
                    <button class="btn">Supprimer</button>
                </div>
            </article>
        </main>
    </div>

</body>
</html>
