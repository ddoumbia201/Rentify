<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — EventShare</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/csrf.js"></script>
    <script src="/js/navbar.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">EventShare</a>
        <div class="nav-actions">
            <span class="btn btn-primary">Admin</span>
        </div>
    </nav>

    <div class="dashboard">
        <div class="dashboard-header">
            <h1>Utilisateurs</h1>
        </div>
 
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
        </table>
 
        <div class="dashboard-header" style="margin-top: 40px;">
            <h1>Annonces</h1>
        </div>
 
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Catégorie</th>
                    <th>Propriétaire</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="goods-tbody"></tbody>
        </table>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>
